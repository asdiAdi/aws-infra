name: Sync to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build the App
        run: npm run build

      - name: Sync static files to S3
        run: |
          S3_BUCKET=$(aws ssm get-parameter --name "/path/to/ssm/" --query Parameter.Value --output text)
          aws s3 sync dist/ s3://$S3_BUCKET --delete

      - name: Invalidate CloudFront Cache
        run: |
          CLOUDFRONT_DISTRIBUTION_ID=$(aws ssm get-parameter --name "/path/to/ssm/" --query Parameter.Value --output text)
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
